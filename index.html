<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TERAmas App</title>

    <meta name="theme-color" content="#ffffff">

    <link rel="manifest" href="manifest.json">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .tarjeta {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 22px;
            padding: 28px 24px 22px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo-comercio {
            width: 100px;
            height: 100px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #eeeeee;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-comercio img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-placeholder {
            color: #888888;
            font-size: 14px;
        }

        .nombre-comercio {
            font-size: 25px;
            font-weight: bold;
            color: #222222;
            margin-bottom: 12px;
        }

        .descripcion {
            font-size: 16px;
            line-height: 1.5;
            color: #555555;
            margin-bottom: 24px;
        }

        .boton-publicacion {
            display: block;
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            background: #222222;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease;
        }

        .boton-publicacion:hover {
            transform: translateY(-2px);
        }

        .boton-publicacion:active {
            transform: translateY(0);
        }

        .marca-teramas {
            margin-top: 22px;
            font-size: 12px;
            color: #999999;
        }

        .marca-teramas strong {
            color: #666666;
        }

        .separador {
            width: 50px;
            height: 2px;
            background: #dddddd;
            margin: 20px auto;
        }

        @media (max-width: 480px) {

            body {
                padding: 14px;
            }

            .tarjeta {
                padding: 24px 20px 20px;
                border-radius: 20px;
            }

            .logo-comercio {
                width: 90px;
                height: 90px;
            }

            .nombre-comercio {
                font-size: 23px;
            }

            .descripcion {
                font-size: 15px;
            }

        }

    </style>
</head>

<body>

    <main class="tarjeta">

        <div class="logo-comercio">

            <!--
                Más adelante el comercio tendrá aquí
                automáticamente su propio logo.
            -->

            <span class="logo-placeholder">
                LOGO
            </span>

        </div>

        <h1 class="nombre-comercio">
            Nombre del comercio
        </h1>

        <div class="separador"></div>

        <p class="descripcion">
            El comercio publicó una nueva novedad.
        </p>

        <a
            id="boton-publicacion"
            class="boton-publicacion"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            VER PUBLICACIÓN
        </a>

        <div class="marca-teramas">
            Notificación mediante <strong>TERAmas App</strong>
        </div>

    </main>

    <script src="app.js"></script>

<script>
(async function () {

  const WORKER_URL =
    "https://teramas-notificaciones.teramasplataforma.workers.dev";

  function base64UrlToUint8Array(base64Url) {
    const padding =
      "=".repeat((4 - (base64Url.length % 4)) % 4);

    const base64 =
      (base64Url + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    const rawData = atob(base64);

    return Uint8Array.from(
      [...rawData].map(char => char.charCodeAt(0))
    );
  }

  try {

    // 1. Registrar Service Worker
    const registration =
      await navigator.serviceWorker.register("/sw.js");

    await navigator.serviceWorker.ready;

    // 2. Obtener clave pública VAPID
    const response =
      await fetch(
        WORKER_URL + "/vapid-public-key"
      );

    const data =
      await response.json();

    if (!data.publicKey) {
      console.error(
        "TERAmas: no se recibió VAPID_PUBLIC_KEY."
      );
      return;
    }

    // 3. Pedir permiso para notificaciones
    const permission =
      await Notification.requestPermission();

    if (permission !== "granted") {
      console.log(
        "TERAmas: notificaciones no autorizadas."
      );
      return;
    }

    // 4. Obtener suscripción existente
    let subscription =
      await registration.pushManager.getSubscription();

    // 5. Si no existe, crearla
    if (!subscription) {

      subscription =
        await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey:
            base64UrlToUint8Array(
              data.publicKey
            )
        });
    }

    // 6. Guardar suscripción en Cloudflare
    const saveResponse =
      await fetch(
        WORKER_URL + "/subscribe",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(subscription)
        }
      );

    const saveResult =
      await saveResponse.json();

    console.log(
      "TERAmas Push:",
      saveResult
    );

  } catch (error) {

    console.error(
      "TERAmas Push ERROR:",
      error
    );

  }

})();
</script>
</body>
</html>
